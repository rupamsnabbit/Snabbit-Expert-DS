<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="white">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<title>__TITLE__</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Tokens as they are in the Paper file this flow was pulled from */
:root {
/*TOKENS*/
  /* foundations/motion.md */
  --motion-standard: 200ms;
  --motion-slow: 300ms;
  --easing-enter: cubic-bezier(0, 0, 0.2, 1);
  --easing-exit: cubic-bezier(0.4, 0, 1, 1);
}
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }   /* no Android font boosting: sizes as drawn */
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--color-bg-secondary);
  -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; overscroll-behavior: none; }
/* The phone is scaled to the artboards' width, so every screen looks as drawn. */
#app { position: relative; width: __W__px; overflow: hidden; }
.screen { position: absolute; inset: 0; will-change: transform, opacity; }
[hidden] { display: none !important; }
.screen > div { position: relative; }
[data-scroll] { scrollbar-width: none; -webkit-overflow-scrolling: touch; }
[data-scroll]::-webkit-scrollbar { display: none; }
[data-input] { width: 0 !important; min-width: 0 !important; flex: 1 1 0% !important; overflow: hidden; }   /* the field, not the input, sets the width */
input.typed { all: unset; box-sizing: border-box; display: block; width: 100%; min-width: 0; max-width: 100%; user-select: text; -webkit-user-select: text; caret-color: var(--color-interactive-default, currentColor); }
input.typed::placeholder { color: var(--color-text-tertiary); opacity: 1; }
[data-input-box] { cursor: text; }
[data-go], [data-acc], [data-swap], [data-step], [data-chip], [data-key], [data-pick] { cursor: pointer; }
[data-go]:active, [data-step]:active, [data-chip]:active, [data-key]:active, [data-pick]:active { filter: brightness(0.94); }
/* Tap somewhere that does nothing: the tappable places light up for a moment */
.hint :is([data-go], [data-acc], [data-swap], [data-step], [data-chip], [data-key]) { outline: 2px solid var(--color-brand); outline-offset: 2px; border-radius: var(--radius-lg);
  animation: hint var(--motion-slow) var(--easing-enter) 2 alternate; }
@keyframes hint { from { outline-color: transparent; } }
/* Screen list: long-press anywhere */
#menu { position: fixed; inset: 0; z-index: 10; display: none; background: color-mix(in srgb, var(--color-bg-inverse) 60%, transparent); }
#menu.open { display: flex; align-items: flex-end; }
#menu .panel { width: 100%; max-height: 80%; overflow-y: auto; background: var(--color-bg, var(--color-bg-primary)); border-radius: var(--radius-xxl) var(--radius-xxl) 0 0;
  padding: var(--space-3, 8px) 0 var(--space-6, 24px); font-family: Outfit, system-ui, sans-serif; }
#menu .grab { width: 32px; height: 4px; border-radius: var(--radius-full); background: var(--color-border, var(--color-border-default)); margin: 0 auto var(--space-4, 12px); }
#menu button { display: flex; gap: var(--space-4, 12px); width: 100%; min-height: 48px; align-items: center; border: 0; background: none;
  padding: 0 var(--space-6, 24px); font: inherit; font-size: var(--text-body-lg); line-height: var(--leading-body-lg); color: var(--color-text-primary); text-align: left; }
#menu button b { width: 44px; flex-shrink: 0; font-weight: var(--font-weight-semibold); color: var(--color-text-secondary); }
#menu button.on { background: var(--color-brand-subtle, var(--color-bg-brand-subtle)); }
/* Saathi talking (voice-prompt.md): the control that says the line pulses while it speaks */
[data-go="voice"].speaking { animation: talk 900ms var(--easing-enter) infinite; border-radius: 50%; }
@keyframes talk { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--color-brand, #E91E63) 45%, transparent); } 100% { box-shadow: 0 0 0 14px transparent; } }
/* Flow switcher: the project's other flows, for the presenter (not part of the app) */
#flows { position: fixed; top: 50%; left: 0; transform: translateY(-50%); z-index: 9; display: flex; align-items: center; gap: 2px; padding: 3px;
  border-radius: 0 999px 999px 0; background: rgba(17, 24, 39, 0.72); backdrop-filter: blur(6px); font: 500 11px/1 Outfit, system-ui, sans-serif; }
#flows .tab { width: 10px; height: 28px; display: grid; place-items: center; color: rgba(255,255,255,.8); font-size: 10px; cursor: pointer; }
#flows:not(.open) a { display: none; }
#flows a { padding: 7px 10px; border-radius: 999px; color: rgba(255, 255, 255, 0.75); text-decoration: none; }
#flows a.on { background: #fff; color: #111827; }
#menu .flows { display: flex; gap: 8px; padding: 0 var(--space-6, 24px) var(--space-4, 12px); }
#menu .flows a { flex: 1; text-align: center; padding: 10px 0; border-radius: 12px; border: 1px solid var(--color-border, #EAECF0); color: var(--color-text-primary, #101828);
  text-decoration: none; font: 500 14px/1.2 Outfit, system-ui, sans-serif; }
#menu .flows a.on { background: var(--color-brand-subtle, #FDF2F8); border-color: var(--color-brand, #EC1C7A); }
.confetti { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 50; }
@media (prefers-reduced-motion: reduce) { .screen, [data-sheet], [data-scrim] { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div id="app">
<!--SCREENS-->
</div>
<div id="menu"><div class="panel"><div class="grab"></div></div></div>
<script>
const app = document.getElementById('app');
const screens = Object.fromEntries([...document.querySelectorAll('.screen')].map(s => [s.dataset.id, s]));
const order = Object.keys(screens);
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const T = { standard: 200, slow: 300 };
const EASE = { enter: 'cubic-bezier(0, 0, 0.2, 1)', exit: 'cubic-bezier(0.4, 0, 1, 1)' };
const W = __W__, HINTS = __HINTS__, LISTS = __LISTS__, TRAILS = __TRAILS__, VOICE_LANG = '__VOICE_LANG__', SIBLINGS = __SIBLINGS__;
let current = null;

// Fit the artboards to this phone
function size() {
  const z = innerWidth / W;
  app.style.zoom = z;
  app.style.height = (innerHeight / z) + 'px';
}
addEventListener('resize', size); size();

const sheetOf = s => s && s.querySelector(':scope > div > [data-sheet]');
const scrimOf = s => s && s.querySelector(':scope > div > [data-scrim]');
const anim = (el, frames, ms, ease) => el && !reduce ? el.animate(frames, { duration: ms, easing: ease, fill: 'both' }).finished.catch(() => {}) : Promise.resolve();   // a cancelled animation is not an error

function statusColour(s) {
  const probe = document.createElement('div');
  probe.style.color = s.dataset.bg; document.body.appendChild(probe);
  const c = getComputedStyle(probe).color; probe.remove();
  document.querySelector('meta[name=theme-color]').content = c;
}

let seen = {}, tick = 0;
async function show(id, dir) {
  const next = screens[id];
  if (!next || next === current) return;
  const prev = current;
  current = next;
  seen[id] = ++tick;
  next.hidden = false;
  [sheetOf(next), scrimOf(next)].forEach(el => el && (el.style.visibility = ''));
  next.querySelectorAll('[data-scroll]').forEach(el => el.scrollTop = 0);
  statusColour(next);
  enter(next);
  next.getAnimations({ subtree: true }).forEach(a => a.cancel());
  const nextSheet = sheetOf(next), prevSheet = sheetOf(prev);
  next.style.zIndex = 2; if (prev) prev.style.zIndex = 1;

  if (dir === 'replace' && prev && (prevSheet && nextSheet || !prevSheet && !nextSheet)) {   // same place, new state: no travel
    if (!nextSheet) await anim(next, [{ opacity: 0 }, { opacity: 1 }], T.standard, EASE.enter);
  } else if (prevSheet) {                            // a sheet leaves the way it came
    await Promise.all([anim(prevSheet, [{ transform: 'none' }, { transform: 'translateY(100%)' }], T.standard, EASE.exit),
                       anim(scrimOf(prev), [{ opacity: 1 }, { opacity: 0 }], T.standard, EASE.exit)]);
  }
  if (nextSheet) {                                   // a sheet rises over the screen it belongs to
    const base = prev && !prevSheet && dir !== 'back' ? anim(next, [{ opacity: 0 }, { opacity: 1 }], T.standard, EASE.enter) : Promise.resolve();
    await Promise.all([base,
      anim(nextSheet, [{ transform: 'translateY(100%)' }, { transform: 'none' }], T.slow, EASE.enter),
      anim(scrimOf(next), [{ opacity: 0 }, { opacity: 1 }], T.slow, EASE.enter)]);
  } else if (prev && prevSheet) {
    await anim(next, [{ opacity: 0 }, { opacity: 1 }], T.standard, EASE.enter);
  } else if (prev) {                                 // screen to screen: push, or pop on back
    const x = dir === 'back' ? -1 : 1;
    await Promise.all([anim(next, [{ transform: `translateX(${x * 100}%)` }, { transform: 'none' }], T.slow, EASE.enter),
                       anim(prev, [{ transform: 'none', opacity: 1 }, { transform: `translateX(${x * -30}%)`, opacity: 0.6 }], T.slow, EASE.enter)]);
  }
  if (prev && prev !== current) { prev.hidden = true; prev.getAnimations({ subtree: true }).forEach(a => a.cancel()); }
}

async function dismiss() {
  const s = sheetOf(current);
  if (!s) return;
  await Promise.all([anim(s, [{ transform: 'none' }, { transform: 'translateY(100%)' }], T.standard, EASE.exit),
                     anim(scrimOf(current), [{ opacity: 1 }, { opacity: 0 }], T.standard, EASE.exit)]);
  [s, scrimOf(current)].forEach(el => el && (el.style.visibility = 'hidden'));
}

async function raise() {
  const s = sheetOf(current);
  if (!s) return;
  [s, scrimOf(current)].forEach(el => el && (el.style.visibility = ''));
  await Promise.all([anim(s, [{ transform: 'translateY(100%)' }, { transform: 'none' }], T.slow, EASE.enter),
                     anim(scrimOf(current), [{ opacity: 0 }, { opacity: 1 }], T.slow, EASE.enter)]);
}

// Where a tap goes. A target is steps: "2.1" push · "back" · "back:0.1" pop to it · "~1.10" replace this one ·
// "dismiss" / "sheet" close or raise this screen's sheet. Conditions pick another target:
// seen:<screen> (the latest seen wins) · picked:<text> (a chosen chip or card) · typed:<value> / typed!:<value>.
let stack = [], pending = null, typed = null;
const picked = () => [...current.querySelectorAll('[data-chip="on"], [data-pick="on"]')].map(e => e.textContent.replace(/\s+/g, ' '));
function choose(go, when) {
  if (!when) return go;
  let best = null, score = -1;
  for (const [cond, to] of when) {
    const i = cond.indexOf(':'), k = cond.slice(0, i), v = cond.slice(i + 1);
    const s = k === 'seen' ? (seen[v] || -1) : (k === 'picked' && picked().some(t => t.includes(v))) ||
      (k === 'typed' && typed === v) || (k === 'typed!' && typed !== v) ? Infinity : -1;
    if (s > score) { score = s; best = to; }
  }
  return best || go;
}
function navigate(target, already = 0) {          // already: entries the phone's back has popped already
  let s = stack.slice(), dir = 'forward';
  for (const st of target.split(' ')) {
    if (st.startsWith('chip:')) { pendingChip = st.slice(5).replace(/_/g, ' '); continue; }
    if (st === 'dismiss') return dismiss();
    if (st === 'sheet') return raise();
    if (st === 'back') { if (s.length > 1) s.pop(); dir = 'back'; }
    else if (st.startsWith('back:')) {
      const id = st.slice(5), i = s.lastIndexOf(id);
      if (i >= 0) { s = s.slice(0, i + 1); dir = 'back'; } else { s.push(id); dir = 'forward'; }
    }
    else if (st.startsWith('~')) { s[s.length - 1] = st.slice(1); if (dir !== 'back') dir = 'replace'; }
    else { s.push(st); dir = 'forward'; }
  }
  let k = 0; while (k < s.length && k < stack.length && s[k] === stack[k]) k++;
  const keep = Math.max(k, 1), pops = stack.length - keep - already;
  stack = s;
  const finish = () => {
    if (k === 0) history.replaceState({ d: 0 }, '', '#' + s[0]);
    for (let j = keep; j < s.length; j++) history.pushState({ d: j }, '', '#' + s[j]);
    show(s[s.length - 1], dir);
    if (pendingChip && current) { setChip(current, pendingChip); pendingChip = null; carry(current); }
  };
  if (pops > 0) { pending = finish; history.go(-pops); } else finish();
}
const go = id => navigate(id);
addEventListener('popstate', e => {                // the phone's own back
  if (pending) { const f = pending; pending = null; return f(); }
  const d = e.state ? e.state.d : 0;
  if (current && current.dataset.onback && d === stack.length - 2) return navigate(current.dataset.onback, 1);
  if (d < stack.length - 1) { stack = stack.slice(0, d + 1); show(stack[d], 'back'); }
  else if (d > stack.length - 1) history.go(stack.length - 1 - d);
});

// ── Inside a screen ────────────────────────────────────────────────────────────────────────────────
// Grow or shrink an element to its new height, so an opening card pushes the page down instead of jumping.
function resize(el, change) {
  const from = el.offsetHeight;
  change();
  const to = el.offsetHeight;
  if (reduce || from === to) return;
  el.style.overflow = 'hidden';
  el.animate([{ height: from + 'px' }, { height: to + 'px' }], { duration: T.standard, easing: EASE.enter })
    .finished.then(() => el.style.overflow = '');
}

// Expandable cards (Card expandable, card.md: caret turns 180° in 200 ms)
function toggleCard(head) {
  const card = head.parentElement;
  const bodies = [...card.children].filter(c => c.hasAttribute('data-acc-body'));
  const opening = bodies.some(b => b.hidden);
  resize(card, () => bodies.forEach(b => b.hidden = !opening));
  head.querySelectorAll('[data-caret]').forEach(c => {
    c.style.transition = `transform ${T.standard}ms ${EASE.enter}`;
    c.style.transform = c.style.transform ? '' : 'rotate(180deg)';
  });
}

// A card Paper draws as a column on one screen and as a row on another: a tap moves between the two drawings.
// The screen keeps its own drawing for the layout it started in.
function toggleSwap(card) {
  const other = card.dataset.layout === 'column' ? 'row' : 'column';
  const own = card._own || { [card.dataset.layout]: card.outerHTML };
  const html = own[other] || document.getElementById(`swap-${card.dataset.swap}-${other}`).innerHTML;
  resize(card.parentElement, () => {
    const t = document.createElement('div'); t.innerHTML = html;
    const next = t.firstElementChild;
    next.dataset.swap = card.dataset.swap; next.dataset.layout = other;
    next._own = { ...own, [card.dataset.layout]: card.outerHTML };
    card.replaceWith(next);
  });
}

// Countdowns run while the screen is showing
let ticker = null;
const toSec = s => s.split(':').reduce((a, b) => a * 60 + +b, 0);
const fromSec = (n, like) => {
  const h = Math.floor(n / 3600), m = Math.floor(n / 60) % 60, s = n % 60, p = v => String(v).padStart(2, '0');
  return like.split(':').length === 3 ? `${h}:${p(m)}:${p(s)}` : `${Math.floor(n / 60)}:${p(s)}`;
};
function startTimers(s) {
  clearInterval(ticker);
  const timers = [...s.querySelectorAll('[data-timer]')].map(el => (el.textContent = el.dataset.timer, { el, left: toSec(el.dataset.timer) }));
  if (timers.length) ticker = setInterval(() => timers.forEach(t => { if (t.left > 0) t.el.textContent = fromSec(--t.left, t.el.dataset.timer); }), 1000);
}

// The 3-digit code: empty boxes, the first one ready; digits fill in; the last digit moves on
let focusBox = null, cursorHTML = '', filledBox = null, digitHTML = '';
(() => {
  const boxes = [...document.querySelectorAll('[data-box]')];
  const withCursor = boxes.find(b => b.firstElementChild && !b.textContent.trim());
  const withDigit = boxes.find(b => b.textContent.trim());
  if (withCursor) { focusBox = withCursor.getAttribute('style'); cursorHTML = withCursor.innerHTML; }
  if (withDigit) { filledBox = withDigit.getAttribute('style'); digitHTML = withDigit.innerHTML; }
})();
function resetCode(s) {
  s.querySelectorAll('[data-code]').forEach(row => { row._typed = []; paintCode(row); });
}
function paintCode(row) {
  [...row.children].forEach((b, i) => {
    const d = row._typed[i];
    b.setAttribute('style', i === row._typed.length && focusBox ? focusBox : filledBox);
    if (d !== undefined) { b.innerHTML = digitHTML; b.firstElementChild.textContent = d; }
    else b.innerHTML = i === row._typed.length ? cursorHTML : '';
  });
}
function typeKey(k) {
  const field = current.querySelector('[data-field]');
  if (field) {                                      // a number field: digits add, the delete key takes one away
    const v = field.textContent;
    field.textContent = typed = k === 'del' ? v.slice(0, -1) : v.length < 6 ? v + k : v;
    return;
  }
  const row = current.querySelector('[data-code]');
  if (!row) return;
  if (k === 'del') row._typed.pop();
  else if (row._typed.length < row.children.length) row._typed.push(k);
  paintCode(row);
  if (row._typed.length === row.children.length) setTimeout(() => go(row.dataset.done), T.slow);
}

// Steppers: − n +, never below zero; the "vs usual" line under the name follows
function step(btn) {
  const group = btn.parentElement;
  const num = [...group.children].find(c => !c.hasAttribute('data-step'));
  const row = group.parentElement;
  if (num.dataset.usual === undefined) num.dataset.usual = num.textContent;
  const n = Math.max(0, +num.textContent + +btn.dataset.step);
  num.textContent = n;
  const note = [...row.querySelectorAll('div')].find(d => /vs usual/.test(d.textContent) && !d.children.length);
  if (note) {
    const usual = +(note.dataset.usual ??= note.textContent.match(/usual (\d+)/)[1]);
    const diff = n - usual;
    note.hidden = diff === 0;
    note.textContent = `${diff > 0 ? '+' : '−'}${Math.abs(diff)} ${Math.abs(diff) === 1 ? 'pc' : 'pcs'} vs usual ${usual}`;
  }
}

// Single-choice chips: the drawn selected chip's look moves to the one she taps. On a picker with "lists" in
// flow.json, the chip also swaps the rows for that chip's options (4 hrs, 6 hrs, 8 hrs …).
function pick(chip, silent) {
  const group = chip.parentElement, on = group.querySelector('[data-chip="on"]');
  if (on && on !== chip) {
    const off = [...group.children].find(c => c.dataset.chip !== 'on');
    const onStyle = on.getAttribute('style'), offStyle = off.getAttribute('style');
    const check = on.querySelector('svg'), onText = on.lastElementChild.getAttribute('style'), offText = off.lastElementChild.getAttribute('style');
    on.setAttribute('style', offStyle); on.lastElementChild.setAttribute('style', offText); on.dataset.chip = '';
    chip.setAttribute('style', onStyle); chip.lastElementChild.setAttribute('style', onText); chip.dataset.chip = 'on';
    if (check) chip.prepend(check);
  }
  chipBy[group.dataset.sig] = { on: norm(chip.textContent), relabel: group._relabel || null };
  const picks = chip.closest('.screen').querySelector('[data-picks]');
  const rows = picks && (LISTS_BY_SIG[picks.dataset.sig] || {})[norm(chip.textContent)];
  if (!rows) return;
  const keep = chosenBy[picks.dataset.sig] ?? (GROUPS[picks.dataset.sig] || {}).drawnText;   // her pick, else the one Paper drew chosen
  fillRows(picks, rows);
  const cards = cardsOf(picks);
  pickCard(cards.find(c => norm(c.textContent) === keep) || cards[0], silent);
  if (!silent && !reduce) cardsOf(picks).forEach((c, i) => anim(c, [{ opacity: 0, transform: 'translateY(8px)' }, { opacity: 1, transform: 'none' }], T.standard + i * 40, EASE.enter));
}
// The chip a step names on arrival (chip:10_hrs). If no chip says it, her own chip (the one Paper drew chosen) takes the words.
function setChip(s, text) {
  const g = s.querySelector('[data-chips]');
  if (!g) return;
  let chip = [...g.children].find(c => norm(c.textContent) === text);
  if (!chip) { chip = g.querySelector('[data-drawn-on]'); chip.lastElementChild.textContent = text; g._relabel = text; }
  pick(chip, true);
}

// ── Times she picks ─────────────────────────────────────────────────────────────────────────────────
// Times as Paper writes them: "11 am – 7 pm", "7–11 am", "11 AM– 7 PM", "9:30 AM". Hours are decimal, 24 h.
const TIME = /(\d{1,2})(?::(\d{2}))?\s*(am|pm)?\s*[–-]\s*(\d{1,2})(?::(\d{2}))?\s*(am|pm)\b|(\d{1,2})(?::(\d{2}))?\s*(am|pm)\b/gi;
const h24 = (h, m, mer) => h % 12 + (mer === 'pm' ? 12 : 0) + m / 60;
function times(text) {
  const out = [];
  for (const m of text.matchAll(TIME)) {
    if (m[4]) {
      let a = h24(+m[1], +(m[2] || 0), (m[3] || m[6]).toLowerCase()), b = h24(+m[4], +(m[5] || 0), m[6].toLowerCase());
      if (!m[3] && a > b) a -= 12;                      // "11–3 pm" is 11 am – 3 pm
      if (b <= a) b += 24;                              // ends after midnight
      out.push({ span: [a, b], at: m.index, src: m[0] });
    } else out.push({ span: [h24(+m[7], +(m[8] || 0), m[9].toLowerCase())], at: m.index, src: m[0] });
  }
  return out;
}
function hm(h, up) {
  h = ((h % 24) + 24) % 24;
  const H = Math.floor(h + 1e-6), M = Math.round((h - H) * 60), mer = H >= 12 ? 'pm' : 'am';
  return [(H % 12 || 12) + (M ? ':' + String(M).padStart(2, '0') : ''), up ? mer.toUpperCase() : mer];
}
function say(spans, up) {                           // content.md: "7 am – 3 pm"; a split day "7–11 am · 3–7 pm"
  return spans.map(([a, b]) => {
    const [x, xm] = hm(a, up);
    if (b === undefined) return `${x} ${xm}`;
    const [y, ym] = hm(b, up);
    return spans.length > 1 && xm === ym ? `${x}–${y} ${ym}` : `${x} ${xm} – ${y} ${ym}`;
  }).join(' · ');
}
const near = (a, b) => Math.abs(a - b) < 0.01;
const sameSpans = (a, b) => a.length === b.length && a.every((x, i) => x.length === b[i].length && x.every((v, j) => near(v, b[i][j])));
const same12 = (a, b) => a.length === b.length && a.every((x, i) => b[i].length === 2 && near(x[0] % 12, b[i][0] % 12) && near(x[1] - x[0], b[i][1] - b[i][0]));
const norm = t => t.replace(/\s+/g, ' ').trim();
const leaves = el => [...el.querySelectorAll('*')].filter(e => !e.children.length && e.textContent.trim() && !e.closest('svg'));
const cardsOf = g => [...g.children].filter(c => c.hasAttribute('data-pick'));
function infoOf(card) {                             // a card's times, and its other lines in order
  const spans = [], srcs = [], rest = [];
  for (const l of leaves(card)) {
    const t = norm(l.textContent), ts = times(t);
    if (ts.length) ts.forEach(x => { spans.push(x.span); srcs.push(x.src); }); else rest.push(t);
  }

// height over motion.standard), the amounts count to what Paper drew (motion.celebrate, linear) and party poppers burst
// from both edges and are gone within 1.5 s (P6). Paper's drawing is the end state. Reduced motion: the end state, at once.
const INTRO = { settle: 800, row: 400, count: 1600, life: 2400 };   // slowed at the lead's ask (2026-10-22)
let introTimers = [], introAnims = [];
const fmtIN = n => Math.round(n).toLocaleString('en-IN');
function intro(s) {
  introTimers.forEach(clearTimeout); introTimers = []; introAnims.forEach(a => a.cancel()); introAnims = [];
  if (!s.dataset.intro) return;
  const rows = [...s.querySelectorAll('[data-intro-row]')], counts = [...s.querySelectorAll('[data-count-from]')];
  counts.forEach(el => { el.dataset.countText ??= el.textContent; el.dataset.countColour ??= el.style.color; el.dataset.countTo ??= el.textContent.match(/\d[\d,]*/)[0].replace(/,/g, ''); });
  const put = (el, n) => { el.textContent = el.dataset.countText.replace(/\d[\d,]*/, fmtIN(n)); };
  rows.forEach(r => { r.dataset.display ??= r.style.display; });
  const end = () => { rows.forEach(r => { r.style.display = r.dataset.display; }); counts.forEach(el => { put(el, +el.dataset.countTo); el.style.color = el.dataset.countColour; }); };
  if (reduce) { end(); return; }
  rows.forEach(r => { r.style.display = 'none'; });
  counts.forEach(el => put(el, +el.dataset.countFrom));
  introTimers.push(setTimeout(() => {
    if (current !== s) return;
    rows.forEach(r => {
      r.style.display = r.dataset.display; const h = r.offsetHeight;
      r.style.overflow = 'hidden';
      introAnims.push(r.animate([{ height: '0px', opacity: 0, transform: 'translateY(-8px)' }, { height: h + 'px', opacity: 1, transform: 'none' }],
        { duration: INTRO.row, easing: EASE.enter }));
      introAnims.at(-1).finished.then(() => { r.style.overflow = ''; }).catch(() => {});
    });
  }, INTRO.settle));
  introTimers.push(setTimeout(() => {
    if (current !== s) return;
    const t0 = performance.now(), up = el => +el.dataset.countTo > +el.dataset.countFrom;
    counts.forEach(el => { if (up(el)) el.style.color = 'var(--color-text-success)'; });
    const step = now => {
      if (current !== s) return;
      const k = Math.min((now - t0) / INTRO.count, 1);
      counts.forEach(el => put(el, +el.dataset.countFrom + (+el.dataset.countTo - +el.dataset.countFrom) * k));
      if (k < 1) requestAnimationFrame(step);
      else introTimers.push(setTimeout(() => counts.forEach(el => { el.style.color = el.dataset.countColour; }), INTRO.count));
    };
    requestAnimationFrame(step);
    if (s.dataset.intro === 'confetti') poppers(s);
  }, INTRO.settle + INTRO.row + 100));
}

// Party poppers: two bursts from the screen's edges, at the height of the first counting amount, in the brand's colours.
function poppers(s) {
  const c = document.createElement('canvas'); c.className = 'confetti'; s.appendChild(c);
  const z = parseFloat(app.style.zoom) || 1, box = s.getBoundingClientRect();
  const w = c.width = box.width * devicePixelRatio, h = c.height = box.height * devicePixelRatio, px = devicePixelRatio;
  const ctx = c.getContext('2d'), css = getComputedStyle(document.documentElement);
  const colours = ['--color-pink-600', '--color-pink-400', '--color-yellow-300', '--color-yellow-500', '--color-green-500', '--color-blue-500']
    .map(v => css.getPropertyValue(v).trim()).filter(Boolean);
  const anchor = [...s.querySelectorAll('[data-count-from]')].find(el => +el.dataset.countTo > +el.dataset.countFrom), ar = anchor ? anchor.getBoundingClientRect() : null;
  const y0 = ((ar ? ar.top + ar.height / 2 : box.top + box.height * 0.3) - box.top) * px;
  const bits = [];
  for (const side of [0, 1]) for (let i = 0; i < 70; i++) {
    const a = (side ? Math.PI + 0.25 : -0.25) + (side ? 1 : -1) * Math.random() * 1.1;     // up and inwards
    const v = (7 + Math.random() * 7) * px;
    bits.push({ x: side ? w : 0, y: y0, vx: Math.cos(a) * v * (side ? 1 : 1), vy: -Math.abs(Math.sin(a)) * v - 3 * px,
      r: Math.random() * Math.PI, vr: (Math.random() - 0.5) * 0.4, s: (4 + Math.random() * 5) * px,
      round: Math.random() < 0.3, col: colours[(Math.random() * colours.length) | 0] });
  }
  const t0 = performance.now();
  const frame = now => {
    const t = now - t0; ctx.clearRect(0, 0, w, h);
    if (t > INTRO.life || !s.contains(c)) { c.remove(); return; }
    const fade = Math.min(1, (INTRO.life - t) / 700);
    for (const b of bits) {
      b.vy += 0.22 * px; b.vx *= 0.99; b.vy *= 0.99; b.x += b.vx; b.y += b.vy; b.r += b.vr;
      ctx.save(); ctx.globalAlpha = fade; ctx.translate(b.x, b.y); ctx.rotate(b.r); ctx.fillStyle = b.col;
      if (b.round) { ctx.beginPath(); ctx.arc(0, 0, b.s / 2.4, 0, 7); ctx.fill(); } else ctx.fillRect(-b.s / 2, -b.s / 4, b.s, b.s / 2);
      ctx.restore();
    }
    requestAnimationFrame(frame);
  };
  requestAnimationFrame(frame);
}

function enter(s) { live(s); startTimers(s); resetCode(s); fillField(s); autoStep(s); inputs(s); toasts(s); intro(s); voiceOnEnter(s); }

// Taps
let pressTimer = null, pressed = false, startY = 0;
app.addEventListener('click', e => {
  if (pressed) { pressed = false; return; }
  if (dragged) { dragged = false; return; }
  const box = e.target.closest('[data-input-box]');
  if (box && !e.target.closest('[data-go]')) { const i = box.querySelector('input.typed'); if (i && e.target !== i) i.focus(); return; }
  const key = e.target.closest('[data-key]');
  if (key && !key.dataset.go) return typeKey(key.dataset.key);
  const el = e.target.closest('[data-acc], [data-swap], [data-step], [data-chip], [data-pick]');
  if (el && !e.target.closest('[data-go]')) {
    if (el.hasAttribute('data-acc')) return toggleCard(el);
    if (el.hasAttribute('data-swap')) return toggleSwap(el);
    if (el.hasAttribute('data-step')) return step(el);
    if (el.hasAttribute('data-chip')) return pick(el);
    if (el.hasAttribute('data-pick')) return pickCard(el);
  }
  const t = e.target.closest('[data-go]');
  if (!t) {
    if (HINTS) { current.classList.remove('hint'); void current.offsetWidth; current.classList.add('hint'); }
    return;
  }
  if (t.dataset.go === 'speak') return speak(t);
  if (t.dataset.go === 'voice') return sayLine(current);
  navigate(choose(t.dataset.go, t.dataset.when && JSON.parse(t.dataset.when)));
});

// The project's other flows: a small switcher at the top, and the same links atop the screen list
if (SIBLINGS.length) {
  const bar = document.createElement('div'); bar.id = 'flows';
  const tab = document.createElement('span'); tab.className = 'tab'; tab.textContent = '⇄'; bar.appendChild(tab);
  tab.addEventListener('click', e => { e.stopPropagation(); bar.classList.toggle('open'); });
  tab.addEventListener('pointerdown', e => e.stopPropagation());
  const row = document.createElement('div'); row.className = 'flows';
  SIBLINGS.forEach(f => [bar, row].forEach(p => { const a = document.createElement('a'); a.textContent = f.label; a.href = f.href;
    if (f.on) { a.className = 'on'; a.onclick = e => e.preventDefault(); }
    else a.onclick = e => { e.preventDefault(); const u = new URL(f.href, location.href); u.searchParams.set('v', Date.now()); location.href = u.href; };
    a.addEventListener('pointerdown', e => e.stopPropagation()); p.appendChild(a); }));
  document.body.appendChild(bar);
  document.querySelector('#menu .panel').appendChild(row);
}
// Long-press anywhere: the list of every screen, for jumping to a variant
const menu = document.getElementById('menu'), panel = menu.querySelector('.panel');
order.forEach(id => {
  const b = document.createElement('button');
  b.innerHTML = `<b>${id}</b><span></span>`;
  b.querySelector('span').textContent = screens[id].dataset.title;
  b.onclick = e => { e.stopPropagation(); menu.classList.remove('open'); navigate(id); };
  b.dataset.id = id; panel.appendChild(b);
});
menu.addEventListener('click', e => { if (e.target === menu) menu.classList.remove('open'); });
// A dismissible sheet (its scrim closes it) follows her finger down and closes past 30 % (bottom-sheet.md)
let drag = null, dragged = false;
app.addEventListener('pointerdown', e => {
  const sheet = e.target.closest('[data-sheet]'), scrim = scrimOf(current);
  if (sheet && scrim && scrim.dataset.go === 'back' && !e.target.closest('input')) drag = { sheet, y: e.clientY, dy: 0 };
});
app.addEventListener('pointermove', e => {
  if (!drag) return;
  drag.dy = Math.max(0, (e.clientY - drag.y) / (parseFloat(app.style.zoom) || 1));
  if (drag.dy > 8) { dragged = true; drag.sheet.style.transform = `translateY(${drag.dy}px)`; }
});
['pointerup', 'pointercancel'].forEach(t => app.addEventListener(t, () => {
  if (!drag) return;
  const { sheet, dy } = drag; drag = null;
  if (dy > sheet.offsetHeight * 0.3) { sheet.style.transform = ''; navigate('back'); }
  else if (dy > 0) { sheet.animate([{ transform: `translateY(${dy}px)` }, { transform: 'none' }], { duration: T.standard, easing: EASE.enter }); sheet.style.transform = ''; }
  setTimeout(() => dragged = false, 0);
}));
app.addEventListener('pointerdown', e => {
  if (e.target.closest('input')) return;
  startY = e.clientY;
  pressTimer = setTimeout(() => {
    pressed = true;
    panel.querySelectorAll('button').forEach(b => b.classList.toggle('on', screens[b.dataset.id] === current));
    menu.classList.add('open');
    navigator.vibrate && navigator.vibrate(10);
  }, 600);
});
['pointerup', 'pointercancel'].forEach(t => app.addEventListener(t, () => clearTimeout(pressTimer)));
app.addEventListener('pointermove', e => { if (Math.abs(e.clientY - startY) > 8) clearTimeout(pressTimer); });
app.addEventListener('contextmenu', e => e.preventDefault());

const first = location.hash.slice(1), start = screens[first] ? first : (screens['__START__'] ? '__START__' : order[0]);
stack = (TRAILS[start] || [start]).slice();          // opened straight on a screen: back goes the way she came
history.replaceState({ d: 0 }, '', '#' + stack[0]);
for (let j = 1; j < stack.length; j++) history.pushState({ d: j }, '', '#' + stack[j]);
show(start);
</script>
</body>
